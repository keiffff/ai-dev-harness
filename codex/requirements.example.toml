# Additional rules for the standard Guardian reviewer.
# Install as /etc/codex/requirements.toml on Linux/macOS, preserving any existing managed requirements.
# guardian_policy_config is intentionally unset: retain the standard security policy.

guardian_extra_policy = "## Task-scoped delegation to existing Codex and Claude agents\n\nThe user authorizes ordinary delegation needed to complete their requested task\nthrough their existing configured Codex subagents, Codex CLI and Claude CLI.\nThis includes passing task-relevant non-secret private repository code, diffs,\nissue/PR text, technical logs, evidence and derived drafts to those agents using\nthe existing account and configured service. A separate process or model call,\nor the private nature of this ordinary project material, is not by itself a\nreason to require a second approval or per-payload consent.\n\nApprove the necessary launcher, local user-state access and task-local file\noperations for that bounded delegation when they stay within the requested task\nand use the existing configured authentication. Review the actual inputs and\neffects; an internal path, repository name or CLI name alone is neither a\nsecret nor proof that the action is authorized.\n\nHonor an explicit user restriction on delegation, destination or data. This\nauthorization does not cover credentials or secret-bearing content, a new\naccount/provider/destination, unrelated work, or bypassing an actual authentication\nor authorization failure. Delegation does not add Git publication, cloud mutation,\ndeployment or remote database authority. Existing sandbox, hooks, required\nwrappers and action-specific authorization remain in force.\n\n## Requested browser validation and existing application sign-in\n\nWhen the user requests browser validation of an identified application\nenvironment, ordinary sign-in needed for that validation may use the existing\nproject credential helper and the corresponding stored account. Apply the\nuser's existing authorization for that destination and operation; do not demand\na separate approval phrase merely because the credentials are stored rather\nthan pasted again. Keep values out of chat, logs, files and agent delegation.\n\nResolve earlier restrictions by their original operation and scope together\nwith later user instructions. An instruction to fetch test material from object\nstorage without browser login does not by itself create a permanent sign-in\nban for a later explicitly requested authenticated UI validation. An explicit\nongoing no-login restriction, or one still governing the same operation, remains\nin force unless the user changes it. Do not infer its revocation from an\nunrelated request or merely from the helper's availability.\n\nThis covers neither another account or destination nor account creation,\ncredential changes, broader permissions, or bypassing authentication failures.\nIt does not authorize other application writes or waive the existing browser\nselection and external-browser approval requirements. Explicitly selected\nin-app browsing itself needs no browser-control approval line.\n\n"
