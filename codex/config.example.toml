# Codex config example for this harness.
# Copy the relevant fragments into your local Codex config and adapt paths.

approval_policy = "on-request"
approvals_reviewer = "auto_review"

# Keep sandbox and approval as separate layers:
# - sandbox: technical filesystem/process boundary
# - approval: human or auto-review decision for boundary crossing
#
# Prefer granular approval when available so routine sandbox prompts do not drown
# important skill/tool decisions.
# approval_policy = { granular = {
#   sandbox_approval = false,
#   rules = false,
#   mcp_elicitations = true,
#   request_permissions = true,
#   skill_approval = true
# }}

# The main and advisor models remain local choices. Native Codex subagents are
# bounded scouts by default; consequential review overrides this routing.
[agents]
enabled = true
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"

# Hook commands should point to copied files under hooks/codex/.
# Wrapper paths are configurable through environment variables used by hooks:
# GIT_USER_APPROVED_WRAPPER=$HOME/.local/bin/git-user-approved
# GH_READONLY_WRAPPER=$HOME/.local/bin/gh-readonly
# AWS_READONLY_WRAPPER=$HOME/.local/bin/aws-readonly
# GCLOUD_READONLY_WRAPPER=$HOME/.local/bin/gcloud-readonly

# After the second and each later compaction in one task, ask Codex to reassess
# a fresh-task handoff at the next safe checkpoint. The hook only injects
# context; it never creates or mutates a task. After adding or changing this
# command, restart Codex and trust the exact hook definition through `/hooks`
# before relying on it.
[[hooks.SessionStart]]
matcher = "^compact$"

[[hooks.SessionStart.hooks]]
type = "command"
command = "/usr/bin/python3 /absolute/path/to/hooks/codex/compaction-handoff-reminder.py"
timeout = 10
statusMessage = "Checking task context health"

# Run Git, cloud CLI, and local shell safety checks through one hook process.
[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/usr/bin/python3 /absolute/path/to/hooks/codex/shell-policy.py"
timeout = 10
statusMessage = "Checking shell safety policy"

# Require a current-turn decision checkpoint before write-bearing shell or
# apply_patch operations. This checks the transition contract, not whether the
# model's semantic judgment is correct.
[[hooks.PreToolUse]]
matcher = "(?i)^(Bash|apply[_-]?patch)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/usr/bin/python3 /absolute/path/to/hooks/codex/decision-integrity-policy.py"
timeout = 10
statusMessage = "Checking decision integrity"

# Keep Browser installed, but block Browser and CUA runtime calls unless the
# latest user message includes the exact one-turn approval line documented in
# AGENTS.md. A native Browser tab mention is a reference, not permission.
[[hooks.PreToolUse]]
matcher = "(?i).*(node|cua)[_-]?repl.*js.*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/usr/bin/python3 /absolute/path/to/hooks/codex/browser-policy.py"
timeout = 10
statusMessage = "Checking explicit Browser permission"
