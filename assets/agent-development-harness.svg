<text x="1256" y="540" font-size="15" font-weight="700">codex-* skills</text><text x="1256" y="557" font-size="11" fill="#8E9AB0">context-engineering / debugging / review / writing</text>
<text x="1256" y="592" font-size="15" font-weight="700">bounded subagents</text><text x="1256" y="609" font-size="11" fill="#8E9AB0">Luna scout / 最終判断・Git 操作は main</text>
<text x="1256" y="644" font-size="15" font-weight="700">external research</text><text x="1256" y="661" font-size="11" fill="#8E9AB0">Web Search・Grok X / 一次情報の再確認</text>
<text x="1256" y="696" font-size="15" font-weight="700">strategic review</text><text x="1256" y="713" font-size="11" fill="#8E9AB0">claude-strategic-review / Fable review</text>
<text x="1256" y="748" font-size="15" font-weight="700">claude-html-report</text><text x="1256" y="765" font-size="11" fill="#8E9AB0">Claude / Fable で HTML 生成 → Human 確認</text>
<text x="1256" y="800" font-size="15" font-weight="700">gemini-japanese-polish</text><text x="1256" y="817" font-size="11" fill="#8E9AB0">Antigravity 経由で文書全体を推敲</text>
