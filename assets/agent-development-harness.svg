<text x="76" y="577" font-size="11.5" fill="#8E9AB0">権限・ANDON・対話・実行境界</text>
<text x="76" y="608" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#5F6B82">TASK SCOPED</text>
<text x="76" y="631" font-size="15" font-weight="700">codex/skills/*</text>
<text x="76" y="649" font-size="11.5" fill="#8E9AB0">作業別 runbook と review contract</text>
<text x="76" y="680" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#5F6B82">CHANGE SCOPED</text>
<text x="76" y="703" font-size="15" font-weight="700">OpenSpec / repo contract</text>
<text x="76" y="721" font-size="11.5" fill="#8E9AB0">scope・I/F・非目標・受入条件・検証条件</text>
<line x1="76" y1="744" x2="360" y2="744" stroke="#263247"/>
<text x="76" y="768" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#34D399">IMPROVEMENT LOOP</text>
<text x="76" y="790" font-size="12.5" font-weight="700">指摘・失敗 → 一般化 → owner → 回帰例</text>
<text x="76" y="812" font-size="10.5" fill="#8E9AB0">AGENTS.md・skill・hook・rules へ反映</text>
<text x="76" y="829" font-size="10.5" fill="#8E9AB0">wrapper・test・OpenSpec / 必要な場合のみ反映</text>
<line x1="396" y1="633" x2="432" y2="633" stroke="#93A4C4" stroke-width="1.7" marker-end="url(#a-w)"/>
