<text x="1092" y="966" font-size="11.5" font-weight="700" letter-spacing="2" fill="#F87171">NO DIRECT EXECUTION</text>
<text x="1092" y="994" font-size="19" font-weight="700">直接実行を禁止</text>
<text x="1092" y="1026" font-size="13" fill="#8E9AB0">cloud write・deploy・IAM 変更・secret 参照・本番DB操作</text>
