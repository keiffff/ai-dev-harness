<text x="490" y="550" font-size="17" font-weight="700">調査</text><text x="620" y="550" font-size="15.5" fill="#C7CFDC">repo・仕様・一次情報を精読</text>
<text x="490" y="598" font-size="17" font-weight="700">実装</text><text x="620" y="598" font-size="15.5" fill="#C7CFDC">差分を作成</text>
<text x="490" y="646" font-size="17" font-weight="700">検証</text><text x="620" y="646" font-size="15.5" fill="#C7CFDC">diff と test で検証</text>
<text x="490" y="694" font-size="17" font-weight="700">統合</text><text x="620" y="694" font-size="15.5" fill="#C7CFDC">review と調査結果を統合し、補助の出力を採否</text>
<text x="490" y="742" font-size="17" font-weight="700">最終判断</text><text x="620" y="742" font-size="15.5" fill="#C7CFDC">I/F・互換性・fallback を決定し、反映前に判断を記録</text>
<line x1="468" y1="766" x2="1132" y2="766" stroke="#34D399" stroke-opacity="0.25"/>
<text x="468" y="790" font-size="12.5" font-weight="700" fill="#34D399">ANDON 発動条件</text>
<text x="580" y="790" font-size="12.5" fill="#8E9AB0">仕様・I/F・optional / nullable / required・永続化・既存データ・外部挙動・権限</text>
<text x="580" y="810" font-size="12.5" fill="#8E9AB0">failure 回復条件や fallback / 互換性 / migration の根拠を確定できない場合</text>
<text x="468" y="838" font-size="11.5" fill="#5F6B82">最終判断・I/F・互換性・Git mutation は main agent が担う</text>

<rect x="1212" y="408" width="340" height="450" rx="14" fill="#111A2B" stroke="#263247" filter="url(#shadow)"/>
