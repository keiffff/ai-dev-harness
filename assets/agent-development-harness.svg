<line x1="1204" y1="653" x2="1168" y2="653" stroke="#93A4C4" stroke-width="1.7" marker-end="url(#a-w)"/><text x="1186" y="676" text-anchor="middle" font-size="11.5" fill="#8E9AB0">材料</text>
<text x="1240" y="841" font-size="11.5" fill="#5F6B82">Codex が採否・repo 反映・Git 操作を担う</text>

