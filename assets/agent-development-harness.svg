<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif" fill="#F3F5F9">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D1526"/><stop offset="1" stop-color="#090F1B"/></linearGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1.1" fill="#233049"/></pattern>
  <radialGradient id="glow" cx="0.5" cy="0.45" r="0.62"><stop offset="0" stop-color="#34D399" stop-opacity="0.15"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/></filter>
  <filter id="gglow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#34D399" flood-opacity="0.32"/></filter>
  <marker id="a-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#93A4C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="a-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="a-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#F87171" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="a-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1600" height="1150" fill="url(#bg)"/>
<rect width="1600" height="1150" fill="url(#dots)"/>
<rect x="260" y="140" width="1080" height="720" fill="url(#glow)"/>
<text x="800" y="64" text-anchor="middle" font-size="44" font-weight="700" letter-spacing="-0.5">AI Agent Development Harness</text>
<text x="800" y="100" text-anchor="middle" font-size="18" fill="#8E9AB0">人間が権限と最終判断を持ち、Codex が開発の文脈と実務を持ち続ける</text>

<rect x="440" y="130" width="720" height="100" rx="14" fill="#111A2B" stroke="#3A4A6B" stroke-width="1.2" filter="url(#shadow)"/>
<rect x="468" y="158" width="44" height="44" rx="11" fill="#93A4C4" fill-opacity="0.14" stroke="#93A4C4" stroke-opacity="0.45"/>
<circle cx="490" cy="171" r="5" fill="none" stroke="#93A4C4" stroke-width="1.8"/><path d="M480 194a10 10 0 0 1 20 0" fill="none" stroke="#93A4C4" stroke-width="1.8" stroke-linecap="round"/>
<text x="530" y="158" font-size="11.5" font-weight="700" letter-spacing="2.2" fill="#5F6B82">AUTHORITY · HUMAN</text>
<text x="530" y="186" font-size="25" font-weight="700">人間</text>
<text x="530" y="212" font-size="14" fill="#8E9AB0">目的・制約・事業文脈・仕様・権限・停止判断・やらないことを決める</text>

<line x1="800" y1="230" x2="800" y2="250" stroke="#3A4A6B" stroke-width="1.8"/>
<rect x="440" y="250" width="720" height="134" rx="14" fill="#0D1925" stroke="#2B3A55" stroke-width="1.1"/>
<text x="464" y="272" font-size="10.5" font-weight="700" letter-spacing="2" fill="#5F6B82">HUMAN ↔ CODEX CONTROL LOOP</text>
<line x1="800" y1="282" x2="800" y2="330" stroke="#2B3A55"/>
<text x="464" y="300" font-size="11" font-weight="700" letter-spacing="1.4" fill="#93A4C4">HUMAN → CODEX</text>
<text x="464" y="322" font-size="17" font-weight="700">目的・制約・権限</text>
<text x="464" y="343" font-size="12" fill="#8E9AB0">最新メッセージが権限を与える</text>
<line x1="765" y1="300" x2="765" y2="348" stroke="#93A4C4" stroke-width="1.7" marker-end="url(#a-w)"/>
<text x="824" y="300" font-size="11" font-weight="700" letter-spacing="1.4" fill="#34D399">CODEX → HUMAN</text>
<text x="824" y="322" font-size="17" font-weight="700">レビュー資料・完了報告</text>
<text x="824" y="343" font-size="12" fill="#8E9AB0">HTML・図表・diff・test / 指摘・残リスク・判断</text>
<line x1="1132" y1="348" x2="1132" y2="300" stroke="#34D399" stroke-width="1.7" marker-end="url(#a-g)"/>
<rect x="464" y="352" width="244" height="24" rx="12" fill="#34D399" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.28"/>
<text x="586" y="369" text-anchor="middle" font-size="11" fill="#C7CFDC">ANDON: 確定できないときに戻す</text>
<rect x="724" y="352" width="412" height="24" rx="12" fill="#93A4C4" fill-opacity="0.08" stroke="#93A4C4" stroke-opacity="0.28"/>
<text x="930" y="369" text-anchor="middle" font-size="11" fill="#C7CFDC">handoff: Codex が通知 → Human が承認 → whole-task を fresh task へ</text>
<line x1="800" y1="384" x2="800" y2="400" stroke="#34D399" stroke-width="1.8" marker-end="url(#a-g)"/>

<rect x="60" y="400" width="340" height="450" rx="14" fill="#111A2B" stroke="#263247" filter="url(#shadow)"/>
<text x="88" y="430" font-size="11.5" font-weight="700" letter-spacing="2.2" fill="#5F6B82">HARNESS SOURCES</text>
<text x="88" y="458" font-size="22" font-weight="700">作業の根拠</text>
<text x="88" y="480" font-size="12.5" fill="#8E9AB0">Codex が判断と作業で参照する契約</text>
<line x1="88" y1="500" x2="372" y2="500" stroke="#263247"/>
<text x="88" y="528" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#5F6B82">ALWAYS ON</text>
<text x="104" y="551" font-size="15" font-weight="700">codex/AGENTS.md</text>
<text x="104" y="569" font-size="11.5" fill="#8E9AB0">権限・ANDON・会話・実行境界</text>
<text x="88" y="600" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#5F6B82">TASK SCOPED</text>
<text x="104" y="623" font-size="15" font-weight="700">codex/skills/*</text>
<text x="104" y="641" font-size="11.5" fill="#8E9AB0">作業別 runbook と review contract</text>
<text x="88" y="672" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#5F6B82">CHANGE SCOPED</text>
<text x="104" y="695" font-size="15" font-weight="700">OpenSpec / repo contract</text>
<text x="104" y="713" font-size="11.5" fill="#8E9AB0">scope・I/F・非目標・受け入れ条件・検証条件</text>
<line x1="88" y1="736" x2="372" y2="736" stroke="#263247"/>
<text x="88" y="760" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#34D399">IMPROVEMENT LOOP</text>
<text x="88" y="782" font-size="12.5" font-weight="700">指摘・失敗 → 一般化 → owner → 回帰例</text>
<text x="88" y="804" font-size="10.5" fill="#8E9AB0">AGENTS.md・skill・hook・rules へ戻す</text>
<text x="88" y="821" font-size="10.5" fill="#8E9AB0">wrapper・test・OpenSpec / 必要な場合だけ変更</text>
<line x1="408" y1="625" x2="432" y2="625" stroke="#93A4C4" stroke-width="1.7" marker-end="url(#a-w)"/>
<text x="420" y="611" text-anchor="middle" font-size="11.5" fill="#8E9AB0">根拠</text>

<rect x="440" y="400" width="720" height="450" rx="16" fill="#0E1F1C" stroke="#34D399" stroke-width="1.7" filter="url(#gglow)"/>
<rect x="468" y="430" width="52" height="52" rx="14" fill="#34D399" fill-opacity="0.14" stroke="#34D399" stroke-opacity="0.45"/>
<rect x="480" y="444" width="28" height="22" rx="3" fill="none" stroke="#34D399" stroke-width="1.8"/><path d="M486 451l5 4-5 4M495 460h7" fill="none" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="540" y="446" font-size="11.5" font-weight="700" letter-spacing="2.2" fill="#34D399">MAIN CONTEXT OWNER</text>
<text x="540" y="480" font-size="34" font-weight="700">Codex</text>
<text x="675" y="480" font-size="15" fill="#8E9AB0">repo 文脈・実務・判断をここに集約する</text>
<line x1="468" y1="505" x2="1132" y2="505" stroke="#34D399" stroke-opacity="0.25"/>
<text x="490" y="542" font-size="17" font-weight="700">調査</text><text x="620" y="542" font-size="15.5" fill="#C7CFDC">repo・仕様・一次情報を読む</text>
<text x="490" y="590" font-size="17" font-weight="700">実装</text><text x="620" y="590" font-size="15.5" fill="#C7CFDC">差分を作る</text>
<text x="490" y="638" font-size="17" font-weight="700">検証</text><text x="620" y="638" font-size="15.5" fill="#C7CFDC">diff と test を確認する</text>
<text x="490" y="686" font-size="17" font-weight="700">統合</text><text x="620" y="686" font-size="15.5" fill="#C7CFDC">review と調査結果を統合し、補助の結果を採否する</text>
<text x="490" y="734" font-size="17" font-weight="700">最終判断</text><text x="620" y="734" font-size="15.5" fill="#C7CFDC">I/F・互換性・fallback を決め、書き込み前に判断を記録する</text>
<line x1="468" y1="758" x2="1132" y2="758" stroke="#34D399" stroke-opacity="0.25"/>
<text x="468" y="782" font-size="12.5" font-weight="700" fill="#34D399">ANDON の条件</text>
<text x="580" y="782" font-size="12.5" fill="#8E9AB0">仕様・I/F・optional / nullable / required・永続化・既存データ・外部挙動・権限</text>
<text x="580" y="802" font-size="12.5" fill="#8E9AB0">failure 後の回復条件・fallback / 互換性 / migration の根拠を確定できないとき</text>
<text x="468" y="830" font-size="11.5" fill="#5F6B82">最終判断・I/F・互換性・Git mutation は main agent に残す</text>

<rect x="1200" y="400" width="340" height="450" rx="14" fill="#111A2B" stroke="#263247" filter="url(#shadow)"/>
<text x="1228" y="430" font-size="11.5" font-weight="700" letter-spacing="2.2" fill="#5F6B82">HARNESS MODULES</text>
<text x="1228" y="458" font-size="22" font-weight="700">補助実行系</text>
<text x="1228" y="480" font-size="12.5" fill="#8E9AB0">実装済みの skill・wrapper・外部 tool</text>
<line x1="1228" y1="500" x2="1512" y2="500" stroke="#263247"/>
<text x="1244" y="532" font-size="15" font-weight="700">codex-* skills</text><text x="1244" y="549" font-size="11" fill="#8E9AB0">context-engineering / debugging / review / writing</text>
<text x="1244" y="584" font-size="15" font-weight="700">bounded subagents</text><text x="1244" y="601" font-size="11" fill="#8E9AB0">Luna scout / 最終判断・Git は main</text>
<text x="1244" y="636" font-size="15" font-weight="700">external research</text><text x="1244" y="653" font-size="11" fill="#8E9AB0">Web Search・Grok X / 一次情報を再確認</text>
<text x="1244" y="688" font-size="15" font-weight="700">strategic review</text><text x="1244" y="705" font-size="11" fill="#8E9AB0">claude-strategic-review / Fable review</text>
<text x="1244" y="740" font-size="15" font-weight="700">claude-html-report</text><text x="1244" y="757" font-size="11" fill="#8E9AB0">Claude / Fable で HTML → Human 確認</text>
<text x="1244" y="792" font-size="15" font-weight="700">gemini-japanese-polish</text><text x="1244" y="809" font-size="11" fill="#8E9AB0">Antigravity 経由で文書全体を推敲</text>
<line x1="1168" y1="605" x2="1192" y2="605" stroke="#93A4C4" stroke-width="1.7" marker-end="url(#a-w)"/><text x="1180" y="591" text-anchor="middle" font-size="11.5" fill="#8E9AB0">依頼</text>
<line x1="1192" y1="645" x2="1168" y2="645" stroke="#93A4C4" stroke-width="1.7" marker-end="url(#a-w)"/><text x="1180" y="668" text-anchor="middle" font-size="11.5" fill="#8E9AB0">材料</text>
<text x="1228" y="833" font-size="11.5" fill="#5F6B82">Codex が採否・repo 反映・Git 操作を保持</text>

<text x="60" y="882" font-size="11.5" font-weight="700" letter-spacing="2.2" fill="#5F6B82">EXTERNAL OPERATIONS</text>
<text x="300" y="882" font-size="13" fill="#8E9AB0">外部への操作は 3 つの経路に分かれる</text>
<line x1="800" y1="850" x2="800" y2="900" stroke="#93A4C4" stroke-width="1.7"/>
<line x1="296" y1="900" x2="1304" y2="900" stroke="#93A4C4" stroke-width="1.7"/>
<line x1="296" y1="900" x2="296" y2="920" stroke="#93A4C4" stroke-width="1.7" marker-end="url(#a-w)"/>
<line x1="800" y1="900" x2="800" y2="920" stroke="#FBBF24" stroke-width="1.7" marker-end="url(#a-y)"/>
<line x1="1304" y1="900" x2="1304" y2="920" stroke="#F87171" stroke-width="1.7" stroke-dasharray="5 5" marker-end="url(#a-r)"/>
<rect x="60" y="928" width="472" height="164" rx="14" fill="#111A2B" stroke="#263247" stroke-width="1.1" filter="url(#shadow)"/>
<text x="84" y="958" font-size="11.5" font-weight="700" letter-spacing="2" fill="#93A4C4">READ · READONLY WRAPPER</text>
<text x="84" y="986" font-size="19" font-weight="700">GitHub・AWS・GCP の read</text>
<text x="84" y="1022" font-size="13" fill="#8E9AB0">readonly wrapper を通して読む</text>
<text x="84" y="1044" font-size="13" fill="#8E9AB0">認証・権限で失敗したら迂回せず、blocker として返す</text>
<rect x="564" y="928" width="472" height="164" rx="14" fill="#1A1710" stroke="#5E4A1B" stroke-width="1.1" filter="url(#shadow)"/>
<text x="588" y="958" font-size="11.5" font-weight="700" letter-spacing="1.8" fill="#FBBF24">APPROVAL BOUNDARY · JEV FIRST</text>
<text x="588" y="986" font-size="19" font-weight="700">承認が必要な操作</text>
<rect x="588" y="1004" width="72" height="26" rx="13" fill="#FBBF24" fill-opacity="0.12" stroke="#FBBF24" stroke-opacity="0.55"/><text x="624" y="1022" text-anchor="middle" font-size="13" font-weight="700" fill="#FBBF24">Jev</text>
<line x1="666" y1="1017" x2="686" y2="1017" stroke="#34D399" stroke-width="1.5" marker-end="url(#a-g)"/>
<rect x="694" y="1004" width="126" height="26" rx="13" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.45"/><text x="757" y="1022" text-anchor="middle" font-size="12.5">allow → 実行</text>
<path d="M624 1030 V1053 H686" fill="none" stroke="#93A4C4" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a-w)"/>
<rect x="694" y="1040" width="102" height="26" rx="13" fill="#93A4C4" fill-opacity="0.10" stroke="#93A4C4" stroke-opacity="0.4"/><text x="745" y="1058" text-anchor="middle" font-size="12.5" fill="#C7CFDC">abstain</text>
<line x1="802" y1="1053" x2="822" y2="1053" stroke="#93A4C4" stroke-width="1.5" marker-end="url(#a-w)"/>
<rect x="830" y="1040" width="174" height="26" rx="13" fill="#93A4C4" fill-opacity="0.10" stroke="#93A4C4" stroke-opacity="0.4"/><text x="917" y="1058" text-anchor="middle" font-size="12.5" fill="#C7CFDC">OpenAI auto-review</text>
<rect x="1068" y="928" width="472" height="164" rx="14" fill="#1A1220" stroke="#6B2A33" stroke-width="1.1" filter="url(#shadow)"/>
<text x="1092" y="958" font-size="11.5" font-weight="700" letter-spacing="2" fill="#F87171">NO DIRECT EXECUTION</text>
<text x="1092" y="986" font-size="19" font-weight="700">直接の実行を禁止</text>
<text x="1092" y="1018" font-size="13" fill="#8E9AB0">cloud write・deploy・IAM変更・secret参照・本番DB操作</text>
<text x="1092" y="1040" font-size="13" fill="#8E9AB0">production環境・データの変更。ローカル開発は対象外</text>
<text x="1092" y="1062" font-size="13" fill="#8E9AB0">必要なコマンドと判断材料を Human へ返す</text>
</svg>
